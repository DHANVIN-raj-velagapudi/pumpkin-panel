[package]
name = "pumpkin-panel"
version = "0.1.0"
edition = "2021"
description = "An installable, ad-free web control panel for Pumpkin Minecraft servers."
license = "AGPL-3.0-only"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"], default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"

argon2 = "0.5"
# Enables `OsRng` for salt generation; argon2 does not re-export this feature.
password-hash = { version = "0.5", features = ["getrandom"] }
uuid = { version = "1", features = ["v4", "serde"] }

rust-embed = "8"
sysinfo = "0.33"
walkdir = "2"
zip = "8"
infer = "0.22"
ureq = "2"
sha2 = "0.10"
aes-gcm = "0.10"
totp-rs = { version = "6", features = ["gen_secret", "otpauth", "qr"] }
hex = "0.4"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
mime_guess = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
